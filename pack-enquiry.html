<style>
body[data-page="pack-enquiry"] {
  background: var(--ps-steam);
}
body[data-page="pack-enquiry"] .pe-page {
  padding: calc(var(--wh-header-h) + clamp(32px, 5vw, 68px)) var(--wh-gut) clamp(72px, 8vw, 120px);
}
.pe-hero {
  display: grid;
  grid-template-columns: minmax(280px, .75fr) minmax(420px, 1fr);
  gap: clamp(28px, 4vw, 64px);
  align-items: start;
  max-width: 1280px;
  margin: 0 auto;
}
.pe-copy {
  position: sticky;
  top: calc(var(--wh-header-h) + 24px);
}
.pe-kicker {
  margin: 0 0 64px;
  color: var(--ps-terracotta);
  font-family: var(--wh-sans);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.pe-copy h1 {
  max-width: 11ch;
  margin: 0;
  color: var(--ps-roast);
  font-family: var(--wh-serif);
  font-size: clamp(48px, 6.5vw, 100px);
  font-weight: 500;
  line-height: .88;
  letter-spacing: -.065em;
}
.pe-copy > p.pe-sub {
  max-width: 36ch;
  margin: 24px 0 0;
  color: rgba(92, 53, 24, .78);
  font-family: var(--wh-sans);
  font-size: clamp(15px, 1.05vw, 16px);
  font-weight: 400;
  line-height: 1.55;
}
.pe-note {
  margin-top: clamp(30px, 4vw, 52px);
  color: rgba(92, 53, 24, .82);
  font-family: var(--wh-serif);
  font-size: clamp(26px, 3vw, 48px);
  font-weight: 600;
  line-height: .98;
  letter-spacing: -.045em;
}
.pe-note strong { color: var(--ps-terracotta); }

/* ── form card ── */
.pe-form-card {
  background: rgba(255, 252, 246, .9);
  border: 1px solid rgba(61, 32, 16, .14);
  box-shadow: 0 26px 60px rgba(61, 32, 16, .12);
  padding: clamp(22px, 3.2vw, 42px);
}
.pe-form-card h2 {
  margin: 0 0 8px;
  color: var(--ps-roast);
  font-family: var(--wh-serif);
  font-size: clamp(32px, 3.4vw, 54px);
  font-weight: 500;
  line-height: .92;
  letter-spacing: -.05em;
}
.pe-form-card > p {
  max-width: 52ch;
  margin: 0 0 24px;
  color: rgba(92, 53, 24, .72);
  font-family: var(--wh-sans);
  font-size: 15px;
  line-height: 1.5;
}
.pe-direct-email {
  margin-top: -12px !important;
  margin-bottom: 24px !important;
  color: rgba(92, 53, 24, .78) !important;
  font-size: 14px !important;
}
.pe-direct-email a {
  color: var(--ps-terracotta);
  font-weight: 800;
  text-decoration: none;
}
.pe-form-card .form { gap: 14px; }
.pe-form-card .field { gap: 5px; }
.pe-form-card .field label {
  color: rgba(61, 32, 16, .74);
  font-family: var(--wh-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
}
.pe-form-card input,
.pe-form-card select,
.pe-form-card textarea {
  width: 100%;
  min-height: 50px;
  border: 1px solid rgba(61, 32, 16, .16);
  border-radius: 0;
  background: #EFE5D5;
  color: var(--ps-roast);
  font-family: var(--wh-sans);
  font-size: 15px;
  padding: 13px 15px;
  outline: none;
}
.pe-form-card textarea { min-height: 110px; resize: vertical; }
.pe-form-card input:focus,
.pe-form-card select:focus,
.pe-form-card textarea:focus {
  border-color: var(--ps-terracotta);
  background: #FFF9EF;
  box-shadow: 0 0 0 3px rgba(232, 64, 12, .08);
}
.pe-form-card .err {
  color: var(--color-error);
  font-family: var(--wh-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.pe-section-label {
  margin: 8px 0 -4px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(61, 32, 16, .12);
  color: var(--ps-roast);
  font-family: var(--wh-sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.pe-form-card .form-submit {
  min-height: 48px;
  margin-top: 8px;
  border: 0;
  border-radius: var(--radius-md, 9px);
  background: var(--ps-terracotta);
  color:#FAF6EE;
  cursor: pointer;
  font-family: var(--wh-sans);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .02em;
}
.pe-form-card .form-success { padding: 20px 0 0; }
.pe-form-card .form-success h3 {
  margin: 0;
  color: var(--ps-roast);
  font-family: var(--wh-serif);
  font-size: clamp(34px, 4vw, 58px);
  font-weight: 500;
  line-height: .9;
  letter-spacing: -.055em;
}
.pe-form-card .form-success p {
  max-width: 46ch;
  color: rgba(92, 53, 24, .78);
  font-family: var(--wh-sans);
  font-size: 15px;
  line-height: 1.55;
}
.pe-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}
.pe-meta span {
  border: 1px solid rgba(61, 32, 16, .14);
  padding: 7px 10px;
  color: rgba(61, 32, 16, .72);
  font-family: var(--wh-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}

/* ── business fields toggle ── */
.pe-business-fields { display: none; }
.pe-business-fields.on { display: contents; }

/* ── photo strip, outside hero grid, full bleed ── */
.pe-photo-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  margin-top: clamp(48px, 7vw, 96px);
  width: 100%;
  overflow: hidden;
}
.pe-photo-strip image-slot {
  display: block;
  width: 100%;
  min-width: 0;
  aspect-ratio: 1.6;
  background: var(--ps-oat);
}

/* ── modal ── */
.pe-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(42, 26, 14, .55);
  backdrop-filter: blur(4px);
  z-index: 9000;
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.pe-modal-overlay.on { display: flex; }
.pe-modal-card {
  background: var(--linen, #f5f0e8);
  border-radius: 12px;
  max-width: 460px; width: 100%;
  padding: clamp(36px, 6vw, 56px) clamp(28px, 5vw, 48px);
  text-align: center;
  position: relative;
  box-shadow: 0 24px 64px rgba(42, 26, 14, .22);
  overflow: hidden;
}
.pe-modal-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, var(--tc, #E8400C), #e07a50, var(--tc, #E8400C));
}
.pe-modal-icon { font-size: 44px; display: block; margin: 0 0 1.1rem; line-height: 1; }
.pe-modal-card h2 {
  font-size: clamp(20px, 2.8vw, 28px); font-weight: 900;
  color: var(--roast, #2a1a0e); margin: 0 0 .6rem; line-height: 1.15; letter-spacing: -.02em;
}
.pe-modal-card p {
  font-size: 14px; color: rgba(42, 26, 14, .6);
  max-width: 38ch; margin: 0 auto 1.75rem; line-height: 1.7;
}
.pe-modal-close-btn {
  display: inline-block; background: var(--roast, #2a1a0e); color: var(--linen, #f5f0e8);
  padding: 12px 26px; border-radius: 4px; font-weight: 700; font-size: 14px;
  border: none; cursor: pointer; font-family: inherit; letter-spacing: .01em;
  transition: opacity .15s;
}
.pe-modal-close-btn:hover { opacity: .8; }
.pe-modal-x {
  position: absolute; top: 13px; right: 14px;
  background: none; border: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: rgba(42, 26, 14, .35);
  padding: 4px 8px; border-radius: 4px; transition: color .15s;
}
.pe-modal-x:hover { color: var(--roast, #2a1a0e); }

@media (max-width: 920px) {
  .pe-hero { grid-template-columns: 1fr; }
  .pe-copy { position: static; }
  .pe-copy h1 { max-width: 13ch; }
}
@media (max-width: 640px) {
  body[data-page="pack-enquiry"] .pe-page { padding-inline: calc(var(--wh-gut) * .75); }
  .pe-form-card { padding: 20px; }
  .row-2 { grid-template-columns: 1fr; }
  .pe-photo-strip { grid-template-columns: 1fr; }
}
</style>
