          - heading "The short version" [level=3] [ref=e95]
          - paragraph [ref=e96]: "We do not have ping-pong tables. We have a clear thesis, an empty geography, and a brand that knows exactly what it is. We are looking for our first co-founder and a small early team: operations, growth, brand, and tech. If building from Day 1 is the kind of thing you have been waiting for, stay with this for a few minutes."
