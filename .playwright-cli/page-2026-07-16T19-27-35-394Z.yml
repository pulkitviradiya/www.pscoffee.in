        - generic [ref=e119]: P . S .
        - generic [ref=e123]:
          - generic [ref=e124]: Section 01 · What we are building
          - heading "What P.S. Coffee is, in one paragraph" [level=2] [ref=e125]
          - paragraph [ref=e126]: A grab-and-go specialty coffee brand. 100% Arabica. Freshly ground at every order. Pod format (50 to 200 square feet) embedded inside co-working spaces, corporate campuses, gyms, and university food courts. App-first ordering. Subscription model. Starting in Ahmedabad, then Surat and Vadodara. The website is live. The waitlist is growing. The Pods are coming. We are at the stage where the team that makes the first ones happen needs to exist.
          - paragraph [ref=e127]: "The market context: India's specialty coffee moment is real, but the infrastructure for it is missing. The cafe model is expensive to operate, slow to scale, and locked out of the buildings where India's urban working generation actually spends its time. We are not building a cafe. We are building the beverage habit brand for the generation that works in a co-working space, not a coffee shop."
          - paragraph [ref=e129]:
            - strong [ref=e130]: P.S. Coffee = Spot On Quality · Spot On Pricing · Spot On Reachability.
            - text: The same 100% Arabica cup, inside the building you are already in, at ₹89. Not a compromise. Not a cafe. A Pod.
        - generic [ref=e131]: P . S .
        - generic [ref=e135]:
          - generic [ref=e136]: Section 02 · The roles
          - heading "What we are looking for" [level=2] [ref=e137]
          - paragraph [ref=e138]: "We are building a small, tight founding team. Each role is genuinely founding-level: you will set the direction for your function, not execute someone else's plan. If you are looking for a defined job description with a reporting structure that already exists, this is not the right fit. If you are the kind of person who would write that job description, read on."
          - generic [ref=e139]:
            - generic [ref=e140]:
              - generic [ref=e141]: Role 01
              - heading "Operations" [level=3] [ref=e142]
              - paragraph [ref=e143]: "You understand what running a QSR actually means at ground level: supply chain, vendor relationships, Pod setup, daily ops cadence. You have done something like this before and have strong opinions about how it should be done."
            - generic [ref=e144]:
              - generic [ref=e145]: Role 02
              - heading "Growth" [level=3] [ref=e146]
              - paragraph [ref=e147]: "You understand the audiences we are building for: co-working, gym, campus, corporate. You know how to build a waitlist, a community, and a daily habit. You think in audience, not in ads."
            - generic [ref=e148]:
              - generic [ref=e149]: Role 03
              - heading "Brand and Content" [level=3] [ref=e150]
              - paragraph [ref=e151]: "You write the way we think: direct, honest, witty without trying too hard. You would read this post and immediately know what to fix. You want the founding brief, not the content calendar someone else already wrote."
            - generic [ref=e152]:
              - generic [ref=e153]: Role 04
              - heading "Tech and Product" [level=3] [ref=e154]
              - paragraph [ref=e155]: "You think about UX the way we think about coffee: simple on the surface, considered underneath. You want to design the ordering app and Pod dashboard, not another SaaS feature nobody asked for."
          - paragraph [ref=e156]: We are not looking for someone who ticks every box. We are looking for someone who owns one thing deeply and cares about the whole brand. One co-founder who can hold the P.S. Coffee thesis across everything they touch is worth more than narrow specialists who do not understand what they are building.
        - generic [ref=e157]: P . S .
        - generic [ref=e161]:
          - generic [ref=e162]: Section 03 · What we offer
          - heading "What we offer in return" [level=2] [ref=e163]
          - paragraph [ref=e164]: We will be direct here, because the pitch does not need decoration.
          - paragraph [ref=e165]:
            - strong [ref=e166]: An early equity stake.
            - text: The terms depend on the role and the conversation, but founding-level contribution gets founding-level equity.
          - paragraph [ref=e167]:
            - strong [ref=e168]: A brand with a clear thesis.
            - text: P.S. Coffee is not an idea searching for a market. It is a defined format, a specific geography, a named customer, and a pricing position that works. You will not be spending the first six months figuring out what the company is. You will be building what it already knows it is.
          - paragraph [ref=e169]:
            - strong [ref=e170]: A founding team that reads, thinks, and is honest about what it does not know.
            - text: We are not going to tell you we have everything figured out. We have the thesis, the brand, the early traction signals, and the appetite to build. The rest is work, and that is what we are looking for people to do alongside us.
          - paragraph [ref=e171]:
            - strong [ref=e172]: The first Pod in Ahmedabad.
            - text: And, yes, the best coffee in the city once it opens.
          - paragraph [ref=e174]:
            - strong [ref=e175]: This is not a startup born in a co-working space that has never run anything.
            - text: "The P.S. Coffee thesis is grounded in real market data: abCoffee's unit economics in India, Luckin Coffee's playbook in China, the specific consumption patterns of Gujarat's urban working generation. We know what we are building and why it works. What we need is the team to make it happen."
        - generic [ref=e176]: P . S .
        - generic [ref=e180]:
          - generic [ref=e181]: Section 04 · For investors
          - heading "For investors reading this" [level=2] [ref=e182]
          - paragraph [ref=e183]: This post is primarily for the people we want to build with. But investors find us through content too, and if you have landed here, this paragraph is for you.
          - paragraph [ref=e184]: We are actively looking for angel-stage investment and conversations with beverage-focused funds. The market thesis (specialty coffee QSR, Pod format, Gujarat first) is laid out across this blog with the data behind it. If you have already formed a view on India's specialty coffee opportunity and you want to be in the first conversation rather than the fifth, write to us.
          - paragraph [ref=e185]:
            - strong [ref=e186]: hello@pscoffee.in
